spring.application.name=employee-payroll-authentication-authorization-demo-project


server.port=8085

# MYSQL DATASOURCE

spring.datasource.url=jdbc:mysql://localhost:3306/dxc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=sujata
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# Hibernate

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JWT
jwt.secret=MyVeryStrongSecretKeyForEmployeePayrollApp2026
jwt.expiration=3600000

# LOGGING (optional but useful)
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE